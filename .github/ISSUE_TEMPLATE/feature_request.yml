name: Feature request
description: Suggest an idea for NeatInk
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: "Tell us how you study or take notes and what is missing. Türkçe de yazabilirsiniz."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other apps or workarounds
      description: Does another app do this well? Links or screenshots help.
